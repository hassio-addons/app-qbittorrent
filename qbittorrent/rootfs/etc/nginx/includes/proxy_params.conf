proxy_http_version          1.1;
proxy_ignore_client_abort   off;
proxy_read_timeout          86400s;
proxy_send_timeout          86400s;
proxy_max_temp_file_size    0;

# Exported torrents and the log download are streamed straight through, rather
# than being collected into a file on disk first.
proxy_buffering             off;

# qBittorrent never answers with a redirect, so there is nothing for NGINX to
# rewrite on the way back.
proxy_redirect              off;

# The Ingress rewrites have to look at the scripts rather than at gzip.
proxy_set_header Accept-Encoding "";

proxy_set_header Connection $connection_upgrade;
proxy_set_header Upgrade $http_upgrade;

# qBittorrent checks the Host header against the address and the port it is
# listening on and rejects the request when the port does not match. The
# browser's own Host header carries Home Assistant's port, so the backend has
# to be named here instead.
proxy_set_header Host 127.0.0.1:8080;

# qBittorrent's CSRF protection compares the Origin and Referer headers against
# that Host, and Ingress requests carry Home Assistant's origin, which will
# never match. Removing both headers is what the check itself treats as a
# same-origin request, so the protection stays on for anybody arriving at the
# published port directly.
proxy_set_header Origin "";
proxy_set_header Referer "";

# Deliberately no X-Forwarded-For or X-Real-IP. qBittorrent is asked to skip
# the login screen for clients on loopback, which is how the Ingress panel
# opens without one, and it only stays on loopback as long as nothing tells
# qBittorrent to read the client address out of a header instead.
